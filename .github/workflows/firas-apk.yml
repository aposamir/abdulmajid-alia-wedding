name: Build Firas Kalkal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'firas-kalkal/**'
      - '.github/workflows/firas-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firas-kalkal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: firas-kalkal-apk
          path: firas-kalkal/android/app/build/outputs/apk/debug/app-debug.apk
