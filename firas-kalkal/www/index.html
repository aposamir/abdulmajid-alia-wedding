<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منشأة فراس كلكل</title>
<style>
  :root { --main:#0f4c5c; --accent:#e36414; --bg:#f6f4ef; --text:#1d2b2f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
  header { background:var(--main); color:#fff; text-align:center; padding:48px 20px 40px; }
  header h1 { font-size:1.9rem; margin-bottom:6px; }
  header p { opacity:.85; }
  main { padding:20px; max-width:640px; margin:auto; }
  section { background:#fff; border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  h2 { color:var(--main); font-size:1.2rem; margin-bottom:8px; }
  ul { padding-inline-start:20px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { flex:1; min-width:140px; text-align:center; text-decoration:none; color:#fff; background:var(--accent); padding:12px; border-radius:10px; font-weight:600; }
  .btn.green { background:#25a244; }
  footer { text-align:center; font-size:.85rem; opacity:.6; padding:16px; }
</style>
</head>
<body>
<header>
  <h1>منشأة فراس كلكل</h1>
  <p>أهلاً بكم</p>
</header>
<main>
  <section>
    <h2>من نحن</h2>
    <p>نبذة مختصرة عن المنشأة ونشاطها. (عدّل هذا النص)</p>
  </section>
  <section>
    <h2>خدماتنا</h2>
    <ul>
      <li>الخدمة الأولى</li>
      <li>الخدمة الثانية</li>
      <li>الخدمة الثالثة</li>
    </ul>
  </section>
  <section>
    <h2>تواصل معنا</h2>
    <div class="btns">
      <a class="btn" href="tel:+000000000000">اتصال</a>
      <a class="btn green" href="https://wa.me/000000000000">واتساب</a>
    </div>
  </section>
</main>
<footer>© منشأة فراس كلكل</footer>
</body>
</html>
