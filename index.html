<!doctype html>
<html lang="ar" dir="rtl"><head>

<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0a08;font-family:Tahoma,Arial,sans-serif}
.page{position:relative;width:min(100%,520px);margin:auto;overflow:hidden;background:#000;line-height:0;min-height:100svh;display:flex;align-items:center}
.video{display:block;width:100%;height:auto;max-height:100svh;object-fit:contain;background:#000}
.counter{position:absolute;z-index:7;top:max(1.5%,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;direction:ltr;line-height:1;padding:5px 10px;border-radius:999px;background:rgba(15,10,7,.16);backdrop-filter:blur(2px);pointer-events:none;white-space:nowrap}
.counter:before{content:"⏳";font-size:13px;filter:grayscale(1) brightness(.25);text-shadow:0 1px 2px #fff8}
.unit{display:flex;align-items:center}.unit:not(:last-child):after{content:":";font:700 14px/1 Tahoma,Arial,sans-serif;color:#17120f;margin-left:4px;text-shadow:0 1px 2px #fff9}
.unit b{font:900 clamp(15px,4.3vw,23px)/1 Tahoma,Arial,sans-serif;color:#17120f;text-shadow:0 1px 2px #fff9,0 2px 5px #fff5;-webkit-text-stroke:.15px #000}

.actions.show{opacity:1;transform:translateY(0);pointer-events:auto}

.sound{position:absolute;z-index:10;top:max(1.5%,env(safe-area-inset-top));right:3%;width:32px;height:32px;border:1px solid #d8b16c99;border-radius:50%;background:rgba(15,10,7,.18);color:#f4d79f;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px);box-shadow:0 2px 8px #0005}
.replay{position:absolute;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;border:1px solid #c79a60cc;border-radius:999px;background:rgba(255,253,245,.92);color:#17120f;padding:11px 18px;font:700 15px/1 Tahoma,Arial,sans-serif;box-shadow:0 5px 18px #0006;backdrop-filter:blur(7px);transition:.3s}.replay.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.toast{position:fixed;left:50%;bottom:72px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#fff;color:#55371f;padding:10px 16px;border-radius:999px;line-height:1.3;font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:521px){.page{margin:18px auto;min-height:0;border-radius:28px;box-shadow:0 24px 70px #0008}.video{max-height:none}}
.gate{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.10);backdrop-filter:blur(1.5px);transition:opacity .55s ease,visibility .55s ease}.gate.hide{opacity:0;visibility:hidden;pointer-events:none}.openInvite{border:1px solid #c59b5f;border-radius:999px;padding:14px 27px;background:linear-gradient(135deg,rgba(255,253,247,.96),rgba(244,226,205,.96));color:#17120f;font:800 17px/1.2 Tahoma,Arial,sans-serif;box-shadow:0 8px 28px #0007,inset 0 0 0 1px #fff;cursor:pointer}.openInvite:active{transform:scale(.98)}
</style></head><body><main class="page">
<video id="film" class="video" playsinline preload="metadata"><source src="wedding-github.mp4" type="video/mp4"></video>
<div id="gate" class="gate"><button id="openInvite" class="openInvite">💍 فتح الدعوة</button></div><button id="sound" class="sound" aria-label="تشغيل الصوت">🔊</button>
<div class="counter"><div class="unit"><b id="days">--</b></div><div class="unit"><b id="hours">--</b></div><div class="unit"><b id="minutes">--</b></div><div class="unit"><b id="seconds">--</b></div></div>
<div id="actions" class="actions"><a id="map" class="hit map" target="_blank" rel="noopener">📍 موقع الصالة</a><a id="rsvp" class="hit rsvp">🌹 تأكيد الحضور</a><button id="share" class="hit share">↗ مشاركة الدعوة</button></div>
<button id="replay" class="replay" aria-label="إعادة تشغيل الفيديو">↻ إعادة التشغيل</button></main><div id="toast" class="toast">تم نسخ رابط الدعوة</div>
<script>

const hosts={majid:"4917670604017",najah:"971544000556",alia:"963949954998",iman:"4917683247825",abuabd:"963951970692"},phone=hosts[new URLSearchParams(location.search).get("h")]||hosts.majid,message="السلام عليكم، أؤكد حضوري حفل زفاف عبد المجيد وعليا يوم الخميس 12/11/2026 الساعة 7:30 مساءً. 🤍";rsvp.href="https://wa.me/"+phone+"?text="+encodeURIComponent(message);map.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("مطعم بيت ورد الشريعة");
sound.onclick=()=>{film.muted=!film.muted;sound.textContent=film.muted?"🔇":"🔊";if(film.paused)film.play().catch(()=>{})};
function actionTiming(){if(!film.duration||!isFinite(film.duration))return;actions.classList.toggle("show",film.currentTime>=Math.max(0,film.duration-5))}film.addEventListener("timeupdate",actionTiming);film.addEventListener("loadedmetadata",actionTiming);film.addEventListener("ended",()=>{actions.classList.add("show");replay.classList.add("show")});film.addEventListener("play",()=>{replay.classList.remove("show");actionTiming()});replay.onclick=()=>{film.currentTime=0;film.muted=false;sound.textContent="🔊";actions.classList.remove("show");replay.classList.remove("show");film.play().catch(()=>{})};
async function startWithSound(){film.muted=false;try{await film.play();sound.textContent="🔊";return true}catch(e){return false}}
openInvite.onclick=async()=>{film.currentTime=0;film.muted=false;await film.play();sound.textContent="🔊";gate.classList.add("hide")};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!film.ended&&gate.classList.contains("hide"))film.play().catch(()=>{})});

</script></body></html>
