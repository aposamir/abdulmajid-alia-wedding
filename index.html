<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3e5d3">
<meta name="description" content="دعوة زفاف عبد المجيد وعليا - الخميس 12/11/2026 الساعة 7:30 مساءً">
<title>زفاف عبد المجيد وعليا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee3d4;font-family:Tahoma,Arial,sans-serif}
.page{position:relative;width:min(100%,520px);margin:auto;overflow:hidden;background:#f8f0e5;line-height:0}
.art{display:block;width:100%;height:auto}
.counter{position:absolute;z-index:7;left:12%;right:12%;top:2.2%;height:5.4%;display:grid;grid-template-columns:repeat(4,1fr);direction:ltr;gap:7px;line-height:1;color:#563820;pointer-events:none;padding:0;background:transparent}
.unit{display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px #fff;position:relative;border:1px solid rgba(190,145,83,.68);border-radius:17px;background:linear-gradient(145deg,rgba(255,253,248,.94),rgba(247,226,202,.94));box-shadow:0 5px 14px #6c462528,inset 0 0 0 1px #fff9}
.unit b{font:700 clamp(15px,4.4vw,23px)/1 Tahoma,Arial,sans-serif;color:#6b4724}.unit span{font:700 clamp(7px,2vw,10px)/1.1 Tahoma,Arial,sans-serif;margin-top:4px;direction:rtl;color:#9a7448}
.actions{position:absolute;z-index:9;left:5%;right:5%;bottom:1.5%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;line-height:1.2;background:transparent;padding:0}
.hit{min-height:38px;border:1px solid rgba(180,135,78,.58);border-radius:16px;background:linear-gradient(135deg,rgba(255,253,249,.94),rgba(249,233,215,.94));box-shadow:0 4px 12px #6c462528,inset 0 0 0 1px #fff9;color:#684720;text-decoration:none;font:700 10.5px/1.15 Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;padding:4px 3px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.hit:before,.hit:after{content:"🌸";font-size:13px;filter:saturate(.7);opacity:.9}.hit:after{content:"✦";color:#b8894c}.hit.time:before{content:"🕰️"}.hit.map:before{content:"🌷"}.hit.share:before{content:"🌸"}
.hit:active{transform:scale(.98)}
.rsvp{grid-column:auto;background:linear-gradient(135deg,#ad7a3f,#e2c38e,#b78649);color:#fff;border-color:#e4c99b;font-size:11px;box-shadow:0 5px 14px #6c46252b,inset 0 1px #fff7}.rsvp:before{content:"🌹"}.rsvp:after{content:"🌹"}
.map,.share{position:static;width:auto;height:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#fff;color:#55371f;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px #0003;line-height:1.3;font-size:13px;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:521px){.page{margin:18px auto;border-radius:28px;box-shadow:0 24px 70px #5d3d2438}}
</style>
</head>
<body>
<main class="page">
<img class="art" src="1791088733144.png" alt="دعوة زفاف عبد المجيد وعليا">
<div class="counter" aria-label="الوقت المتبقي">
<div class="unit"><b id="days">--</b><span>يوم</span></div>
<div class="unit"><b id="hours">--</b><span>ساعة</span></div>
<div class="unit"><b id="minutes">--</b><span>دقيقة</span></div>
<div class="unit"><b id="seconds">--</b><span>ثانية</span></div>
</div>
<div class="actions">
<a id="rsvp" class="hit rsvp" aria-label="تأكيد الحضور عبر واتساب">تأكيد الحضور عبر واتساب</a>
<a id="map" class="hit map" target="_blank" rel="noopener" aria-label="فتح موقع الصالة">📍 موقع الصالة</a>
<button id="share" class="hit share" aria-label="مشاركة الدعوة">↗ مشاركة الدعوة</button>
</div>
</main>
<div id="toast" class="toast">تم نسخ رابط الدعوة</div>
<script>
const target=new Date("2026-11-12T19:30:00");
function tick(){let ms=Math.max(0,target-new Date()),t=Math.floor(ms/1000);days.textContent=Math.floor(t/86400);t%=86400;hours.textContent=String(Math.floor(t/3600)).padStart(2,"0");t%=3600;minutes.textContent=String(Math.floor(t/60)).padStart(2,"0");seconds.textContent=String(t%60).padStart(2,"0")}tick();setInterval(tick,1000);
const phone="963951970692";
const message="السلام عليكم، أؤكد حضوري حفل زفاف عبد المجيد وعليا يوم الخميس 12/11/2026 الساعة 7:30 مساءً. 🤍";
rsvp.href="https://wa.me/"+phone+"?text="+encodeURIComponent(message);
map.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("مطعم بيت ورد الشريعة");
share.addEventListener("click",async()=>{const data={title:"زفاف عبد المجيد وعليا",text:"دعوة زفاف عبد المجيد وعليا — الخميس 12/11/2026، الساعة 7:30 مساءً 🤍",url:location.href};try{if(navigator.share){await navigator.share(data);return}await navigator.clipboard.writeText(location.href);toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)}catch(e){}});
</script>
</body></html>
