<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0a08"><title>زفاف عبد المجيد وعليا</title>

<meta property="og:type" content="website"><meta property="og:locale" content="ar_AR"><meta property="og:title" content="دعوة زفاف عبد المجيد وعليا"><meta property="og:description" content="الخميس 12/11/2026 — الساعة 7:30 مساءً — مطعم بيت ورد الشريعة">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0a08;font-family:Tajawal,Tahoma,Arial,sans-serif}
.page{position:relative;width:min(100%,520px);margin:auto;overflow:hidden;background:#000;line-height:0;min-height:100svh;display:flex;align-items:center}
.video{display:block;width:100%;height:auto;max-height:100svh;object-fit:contain;background:#000}
.counter{position:absolute;z-index:7;top:max(1.5%,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;direction:ltr;line-height:1;padding:5px 10px;border-radius:999px;background:rgba(15,10,7,.16);backdrop-filter:blur(2px);pointer-events:none;white-space:nowrap}
.counter:before{content:"⏳";font-size:13px;filter:grayscale(1) brightness(.25);text-shadow:0 1px 2px #fff8}
.unit{display:flex;align-items:center}.unit:not(:last-child):after{content:":";font:700 14px/1 Tahoma,Arial,sans-serif;color:#17120f;margin-left:4px;text-shadow:0 1px 2px #fff9}
.unit b{font:900 clamp(15px,4.3vw,23px)/1 Tahoma,Arial,sans-serif;color:#17120f;text-shadow:0 1px 2px #fff9,0 2px 5px #fff5;-webkit-text-stroke:.15px #000}
.actions{position:absolute;z-index:9;left:5%;right:5%;bottom:max(1.8%,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:7px;line-height:1.2;opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity .7s ease,transform .7s ease}
.hit:active{transform:scale(.97)}.contact{grid-column:1/-1}.actions.show{opacity:1;transform:translateY(0);pointer-events:auto}
.hit{min-height:44px;border:1px solid #d4a85f;border-radius:17px;background:linear-gradient(135deg,#fffdf5f2,#f1d9b4ee);box-shadow:0 6px 20px #000a,0 0 14px #d4a85f55,inset 0 0 0 1px #fff9;color:#5a3a17;transition:transform .2s,box-shadow .2s;text-decoration:none;font:700 15px/1.15 Tajawal,Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:5px 3px;backdrop-filter:blur(8px)}
.rsvp{grid-column:2;background:linear-gradient(135deg,#fffdf5ef,#f4dfc9ed);color:#65431e;border-color:#c79a60cc;font-size:15px}.map{grid-column:1}.share{grid-column:3}
.sound{position:absolute;z-index:10;top:max(1.5%,env(safe-area-inset-top));right:3%;width:32px;height:32px;border:1px solid #d8b16c99;border-radius:50%;background:rgba(15,10,7,.18);color:#f4d79f;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px);box-shadow:0 2px 8px #0005}
.replay{position:absolute;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;border:1px solid #c79a60cc;border-radius:999px;background:rgba(255,253,245,.92);color:#17120f;padding:11px 18px;font:700 15px/1 Tahoma,Arial,sans-serif;box-shadow:0 5px 18px #0006;backdrop-filter:blur(7px);transition:.3s}.replay.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.toast{position:fixed;left:50%;bottom:72px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#fff;color:#55371f;padding:10px 16px;border-radius:999px;line-height:1.3;font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:521px){.page{margin:18px auto;min-height:0;border-radius:28px;box-shadow:0 24px 70px #0008}.video{max-height:none}}
.gate{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.10);backdrop-filter:blur(1.5px);transition:opacity .55s ease,visibility .55s ease}.gate.hide{opacity:0;visibility:hidden;pointer-events:none}.openInvite{border:1px solid #c59b5f;border-radius:999px;padding:14px 27px;background:linear-gradient(135deg,rgba(255,253,247,.96),rgba(244,226,205,.96));color:#17120f;font:800 18px/1.2 Tajawal,Tahoma,Arial,sans-serif;box-shadow:0 8px 28px #0007,inset 0 0 0 1px #fff;cursor:pointer}.openInvite:active{transform:scale(.98)}
.sheet{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.35s;line-height:1.3}.sheet.show{opacity:1;visibility:visible}
.panel{width:100%;max-height:85%;overflow:auto;padding:18px 16px max(18px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:linear-gradient(160deg,#fffdf6,#f3dfbf);border-top:2px solid #d4a85f;color:#4a2f14;transform:translateY(30px);transition:.35s}.sheet.show .panel{transform:none}
.panel h2{margin:0 0 4px;text-align:center;font:800 20px/1.3 Tajawal,Tahoma,sans-serif;color:#7a5220}.panel p{margin:0 0 14px;text-align:center;font-size:13px;color:#8a6a3f}
.person{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;margin-bottom:8px;border:1px solid #d4a85f88;border-radius:16px;background:#fffdf8cc}.person b{font:700 16px/1.2 Tajawal,Tahoma,sans-serif}.person small{display:block;direction:ltr;text-align:right;font-size:12px;color:#8a6a3f;margin-top:3px}
.person .go{display:flex;gap:6px}.person a{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;background:linear-gradient(135deg,#e9c987,#c79a4e);box-shadow:0 2px 8px #0004}
.close{display:block;margin:10px auto 0;border:0;background:none;color:#7a5220;font:700 15px Tajawal,Tahoma,sans-serif;cursor:pointer;padding:8px 20px}
</style></head><body><main class="page">
<video id="film" class="video" playsinline preload="metadata"><source src="wedding-github.mp4" type="video/mp4"></video>
<div id="gate" class="gate"><button id="openInvite" class="openInvite">💍 فتح الدعوة</button></div><button id="sound" class="sound" aria-label="تشغيل الصوت">🔊</button>
<div class="counter"><div class="unit"><b id="days">--</b></div><div class="unit"><b id="hours">--</b></div><div class="unit"><b id="minutes">--</b></div><div class="unit"><b id="seconds">--</b></div></div>
<div id="actions" class="actions"><a id="map" class="hit map" target="_blank" rel="noopener">📍 موقع الصالة</a><a id="rsvp" class="hit rsvp">🌹 تأكيد الحضور</a><button id="share" class="hit share">↗ مشاركة الدعوة</button><button id="contactBtn" class="hit contact">📞 أرقام التواصل</button></div>
<div id="sheet" class="sheet"><div class="panel"><h2>للتواصل والاستفسار</h2><p>يسعدنا تواصلكم معنا عبر الاتصال أو واتساب</p><div id="people_"></div><button id="closeSheet" class="close">إغلاق</button></div></div>
<button id="replay" class="replay" aria-label="إعادة تشغيل الفيديو">↻ إعادة التشغيل</button></main><div id="toast" class="toast">تم نسخ رابط الدعوة</div>
<script>
const target=new Date("2026-11-12T19:30:00");function tick(){let ms=Math.max(0,target-new Date()),t=Math.floor(ms/1000);days.textContent=Math.floor(t/86400);t%=86400;hours.textContent=String(Math.floor(t/3600)).padStart(2,"0");t%=3600;minutes.textContent=String(Math.floor(t/60)).padStart(2,"0");seconds.textContent=String(t%60).padStart(2,"0")}tick();setInterval(tick,1000);
const hosts={majid:"4917670604017",najah:"971544000556",alia:"963949954998",iman:"4917683247825",abuabd:"963951970692",yamen:"963945728944"},phone=hosts[new URLSearchParams(location.search).get("h")]||hosts.majid,message="السلام عليكم، أؤكد حضوري حفل زفاف عبد المجيد وعليا يوم الخميس 12/11/2026 الساعة 7:30 مساءً. 🤍";rsvp.href="https://wa.me/"+phone+"?text="+encodeURIComponent(message);map.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("مطعم بيت ورد الشريعة");
const people=[["عبد المجيد","majid"],["نجاح","najah"],["عليا","alia"],["إيمان","iman"],["أبو عبد","abuabd"],["أم يمن","yamen"]];
people.forEach(([n,k])=>{const d=document.createElement("div");d.className="person";d.innerHTML='<div><b>'+n+'</b><small>+'+hosts[k]+'</small></div><div class="go"><a href="tel:+'+hosts[k]+'" aria-label="اتصال بـ '+n+'">📞</a><a href="https://wa.me/'+hosts[k]+'" target="_blank" rel="noopener" aria-label="واتساب '+n+'">💬</a></div>';people_.appendChild(d)});
contactBtn.onclick=()=>sheet.classList.add("show");closeSheet.onclick=()=>sheet.classList.remove("show");sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove("show")};
sound.onclick=()=>{film.muted=!film.muted;sound.textContent=film.muted?"🔇":"🔊";if(film.paused)film.play().catch(()=>{})};
function actionTiming(){if(!film.duration||!isFinite(film.duration))return;actions.classList.toggle("show",film.currentTime>=Math.max(0,film.duration-5))}film.addEventListener("timeupdate",actionTiming);film.addEventListener("loadedmetadata",actionTiming);film.addEventListener("ended",()=>{actions.classList.add("show");replay.classList.add("show")});film.addEventListener("play",()=>{replay.classList.remove("show");actionTiming()});replay.onclick=()=>{film.currentTime=0;film.muted=false;sound.textContent="🔊";actions.classList.remove("show");replay.classList.remove("show");film.play().catch(()=>{})};
async function startWithSound(){film.muted=false;try{await film.play();sound.textContent="🔊";return true}catch(e){return false}}
openInvite.onclick=async()=>{film.currentTime=0;film.muted=false;await film.play();sound.textContent="🔊";gate.classList.add("hide")};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!film.ended&&gate.classList.contains("hide"))film.play().catch(()=>{})});
share.addEventListener("click",async()=>{const d={title:"زفاف عبد المجيد وعليا",text:"دعوة زفاف عبد المجيد وعليا — الخميس 12/11/2026، الساعة 7:30 مساءً 🤍",url:location.href};try{if(navigator.share){await navigator.share(d);return}await navigator.clipboard.writeText(location.href);toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)}catch(e){}})
</script></body></html>
