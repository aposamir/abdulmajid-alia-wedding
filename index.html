<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0a08"><title>زفاف عبد المجيد وعليا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0a08;font-family:Tahoma,Arial,sans-serif}
.page{position:relative;width:min(100%,520px);margin:auto;overflow:hidden;background:#000;line-height:0;min-height:100svh;display:flex;align-items:center}
.video{display:block;width:100%;height:auto;max-height:100svh;object-fit:contain;background:#000}
.counter{position:absolute;z-index:7;top:max(1.5%,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;direction:ltr;line-height:1;padding:5px 10px;border-radius:999px;background:rgba(15,10,7,.16);backdrop-filter:blur(2px);pointer-events:none;white-space:nowrap}
.counter:before{content:"⏳";font-size:13px;filter:grayscale(1) brightness(.25);text-shadow:0 1px 2px #fff8}
.unit{display:flex;align-items:center}.unit:not(:last-child):after{content:":";font:700 14px/1 Tahoma,Arial,sans-serif;color:#17120f;margin-left:4px;text-shadow:0 1px 2px #fff9}
.unit b{font:900 clamp(15px,4.3vw,23px)/1 Tahoma,Arial,sans-serif;color:#17120f;text-shadow:0 1px 2px #fff9,0 2px 5px #fff5;-webkit-text-stroke:.15px #000}
.actions{position:absolute;z-index:9;left:5%;right:5%;bottom:max(1.8%,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:7px;line-height:1.2;opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity .7s ease,transform .7s ease}
.actions.show{opacity:1;transform:translateY(0);pointer-events:auto}
.hit{min-height:42px;border:1px solid #c79a60cc;border-radius:17px;background:linear-gradient(135deg,#fffdf5ef,#f4dfc9ed);box-shadow:0 5px 18px #0007,inset 0 0 0 1px #fff9;color:#65431e;text-decoration:none;font:700 10.5px/1.15 Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:5px 3px;backdrop-filter:blur(8px)}
.rsvp{grid-column:2;background:linear-gradient(135deg,#a97032,#e4c78f,#a87539);color:#fff;border-color:#f0d8a9;font-size:11px}.map{grid-column:1}.share{grid-column:3}
.sound{position:absolute;z-index:10;top:max(1.5%,env(safe-area-inset-top));right:3%;width:32px;height:32px;border:1px solid #d8b16c99;border-radius:50%;background:rgba(15,10,7,.18);color:#f4d79f;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px);box-shadow:0 2px 8px #0005}
.toast{position:fixed;left:50%;bottom:72px;transform:translate(-50%,20px);opacity:0;z-index:20;background:#fff;color:#55371f;padding:10px 16px;border-radius:999px;line-height:1.3;font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:521px){.page{margin:18px auto;min-height:0;border-radius:28px;box-shadow:0 24px 70px #0008}.video{max-height:none}}
</style></head><body><main class="page">
<video id="film" class="video" autoplay playsinline loop preload="metadata"><source src="wedding-github.mp4" type="video/mp4"></video>
<button id="sound" class="sound" aria-label="تشغيل الصوت">🔇</button>
<div class="counter"><div class="unit"><b id="days">--</b></div><div class="unit"><b id="hours">--</b></div><div class="unit"><b id="minutes">--</b></div><div class="unit"><b id="seconds">--</b></div></div>
<div id="actions" class="actions"><a id="map" class="hit map" target="_blank" rel="noopener">📍 موقع الصالة</a><a id="rsvp" class="hit rsvp">🌹 تأكيد الحضور</a><button id="share" class="hit share">↗ مشاركة الدعوة</button></div>
</main><div id="toast" class="toast">تم نسخ رابط الدعوة</div>
<script>
const target=new Date("2026-11-12T19:30:00");function tick(){let ms=Math.max(0,target-new Date()),t=Math.floor(ms/1000);days.textContent=Math.floor(t/86400);t%=86400;hours.textContent=String(Math.floor(t/3600)).padStart(2,"0");t%=3600;minutes.textContent=String(Math.floor(t/60)).padStart(2,"0");seconds.textContent=String(t%60).padStart(2,"0")}tick();setInterval(tick,1000);
const phone="963951970692",message="السلام عليكم، أؤكد حضوري حفل زفاف عبد المجيد وعليا يوم الخميس 12/11/2026 الساعة 7:30 مساءً. 🤍";rsvp.href="https://wa.me/"+phone+"?text="+encodeURIComponent(message);map.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("مطعم بيت ورد الشريعة");
sound.onclick=()=>{film.muted=!film.muted;sound.textContent=film.muted?"🔇":"🔊";if(film.paused)film.play().catch(()=>{})};
function actionTiming(){if(!film.duration||!isFinite(film.duration))return;actions.classList.toggle("show",film.currentTime>=Math.max(0,film.duration-5))}film.addEventListener("timeupdate",actionTiming);film.addEventListener("loadedmetadata",actionTiming);film.addEventListener("ended",()=>actions.classList.add("show"));film.addEventListener("play",actionTiming);
async function startWithSound(){film.muted=false;try{await film.play();sound.textContent="🔊"}catch(e){film.muted=true;film.play().catch(()=>{});sound.textContent="🔇"}}
startWithSound();
["pointerdown","touchstart","click"].forEach(ev=>document.addEventListener(ev,()=>{if(film.muted){film.muted=false;film.play().catch(()=>{});sound.textContent="🔊"}},{once:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)startWithSound()});
share.addEventListener("click",async()=>{const d={title:"زفاف عبد المجيد وعليا",text:"دعوة زفاف عبد المجيد وعليا — الخميس 12/11/2026، الساعة 7:30 مساءً 🤍",url:location.href};try{if(navigator.share){await navigator.share(d);return}await navigator.clipboard.writeText(location.href);toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)}catch(e){}})
</script></body></html>
