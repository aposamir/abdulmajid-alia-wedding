<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج المعهد</title>
<style>
:root{--navy:#1f3a5f;--bg:#f5f7fa;--card:#fff;--line:#dde3ea;--ok:#12775f;--warn:#b7791f;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#1c2733;padding-bottom:76px}
header{background:var(--navy);color:#fff;padding:18px 16px}header h1{margin:0;font-size:20px}header small{opacity:.8}
header .top{display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 14px}
.btn.alt{background:#eaf0f7;color:var(--navy);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
main{padding:14px;max-width:760px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.card h2{margin:0 0 10px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px}.stat span{color:#667}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:4px 0 8px;background:#fff}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#eaf0f7;color:var(--navy)}
.tag.ok{background:#dff3ec;color:var(--ok)}.tag.bad{background:#fbe3df;color:var(--bad)}.tag.warn{background:#fdf1d9;color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#eaf0f7;border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:16px 4px;color:var(--navy);font-size:14px}
nav button.on{background:var(--navy);color:#fff}
.log div{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.log time{color:#889;font-size:12px;display:block}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-inline-end:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.login{max-width:420px;margin:40px auto}.muted{color:#778;font-size:13px}
</style>
</head>
<body>
<header><div class="top"><div><h1 id="title">برنامج المعهد</h1><small id="sub"></small></div><button class="btn alt sm" id="out" hidden>خروج</button></div></header>
<main id="app"></main>
<nav id="nav" hidden></nav>
<script>
const ROLES={admin:'المدير',secretary:'أمينة السر',supervisor:'الموجّهة',teacher:'المعلمة',student:'الطالبة'};
const KEY='institute-v1';
const def=()=>({pins:{admin:'1234',secretary:'1111',supervisor:'2222'},teachers:[{id:1,name:'معلمة 1',pin:'3333'}],
 students:[],records:[],attendance:[],notes:[],log:[],seq:10});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}
let sess=null,tab=null;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('ar',{dateStyle:'short',timeStyle:'medium'});
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function log(text){S.log.unshift({t:now(),who:who(),role:sess?.role,text});S.log=S.log.slice(0,300);save()}
function who(){return sess?(sess.name||ROLES[sess.role]):''}
const tName=id=>S.teachers.find(t=>t.id==id)?.name||'—';
const sName=id=>S.students.find(s=>s.id==id)?.name||'—';
function scope(){ // students visible to current role
 if(sess.role==='teacher')return S.students.filter(s=>s.teacher==sess.id);
 if(sess.role==='student')return S.students.filter(s=>s.id==sess.id);
 return S.students}

function loginView(){
 $('#nav').hidden=true;$('#out').hidden=true;$('#title').textContent='برنامج المعهد';$('#sub').textContent='اختاري البوابة للدخول';
 $('#app').innerHTML=`<div class="card login"><h2>تسجيل الدخول</h2>
 <select id="r">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
 <div id="who"></div>
 <input id="pin" type="password" inputmode="numeric" placeholder="الرمز السري" autocomplete="off">
 <button class="btn" style="width:100%" id="go">دخول</button>
 <p class="muted">رموز البداية: المدير 1234 · أمينة السر 1111 · الموجّهة 2222 · المعلمة 3333. الطالبة تدخل برمز طالبتها. غيّريها من بوابة المدير.</p></div>`;
 const pick=()=>{const r=$('#r').value;let h='';
  if(r==='teacher')h=`<select id="pid">${S.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>`;
  if(r==='student')h=`<select id="pid">${S.students.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')||'<option value="">لا توجد طالبات بعد</option>'}</select>`;
  $('#who').innerHTML=h};
 $('#r').onchange=pick;pick();
 $('#go').onclick=()=>{const r=$('#r').value,pin=$('#pin').value.trim(),pid=$('#pid')?.value;let ok=false,o={role:r};
  if(r==='teacher'){const t=S.teachers.find(x=>x.id==pid);ok=t&&t.pin===pin;o.id=t?.id;o.name=t?.name}
  else if(r==='student'){const s=S.students.find(x=>x.id==pid);ok=s&&s.pin===pin;o.id=s?.id;o.name=s?.name}
  else ok=S.pins[r]===pin;
  if(!ok)return alert('الرمز غير صحيح');
  sess=o;tab=r;log('دخلت إلى بوابة '+ROLES[r]);render()}}

function render(){
 if(!sess)return loginView();
 $('#out').hidden=false;$('#out').onclick=()=>{log('خرجت من النظام');sess=null;loginView()};
 $('#sub').textContent=ROLES[tab]+(sess.name?' — '+sess.name:'');
 $('#title').textContent='بوابة '+ROLES[tab];
 const roles=sess.role==='admin'?Object.keys(ROLES):[sess.role];
 const nav=$('#nav');nav.hidden=roles.length<2;
 nav.innerHTML=roles.map(r=>`<button class="${r===tab?'on':''}" data-tab="${r}">${ROLES[r]}</button>`).join('');
 nav.onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
 $('#app').innerHTML=({admin:vAdmin,secretary:vSecretary,supervisor:vSupervisor,teacher:vTeacher,student:vStudent})[tab]();
 bind()}

function logCard(n=15,mine=false){const items=S.log.filter(l=>!mine||l.who===who()).slice(0,n);
 return `<div class="card"><h2><span class="live"></span>سجل الأحداث المباشر</h2><div class="log">${items.map(l=>`<div><time>${l.t}</time><b>${esc(l.who||'—')}</b> (${ROLES[l.role]||''}): ${esc(l.text)}</div>`).join('')||'<span class="muted">لا أحداث بعد</span>'}</div></div>`}
function attToday(s){return S.attendance.find(a=>a.sid==s.id&&a.d===today())}

function vAdmin(){
 const a=S.attendance.filter(x=>x.d===today());
 return `<div class="grid"><div class="stat"><b>${S.students.length}</b><span>طالبات</span></div><div class="stat"><b>${S.teachers.length}</b><span>معلمات</span></div>
 <div class="stat"><b>${a.filter(x=>x.st==='حاضرة').length}</b><span>حاضرات اليوم</span></div><div class="stat"><b>${a.filter(x=>x.st==='غائبة').length}</b><span>غائبات اليوم</span></div></div><br>
 <div class="card"><h2>إضافة معلمة</h2><input id="tn" placeholder="اسم المعلمة"><input id="tp" placeholder="رمزها السري"><button class="btn" data-act="addT">إضافة</button></div>
 <div class="card"><h2>المعلمات</h2>${S.teachers.map(t=>`<div class="row"><span>${esc(t.name)} <span class="muted">(${S.students.filter(s=>s.teacher==t.id).length} طالبة)</span></span><span class="muted">رمز: ${esc(t.pin)}</span></div>`).join('')}</div>
 <div class="card"><h2>الرموز السرية للبوابات</h2>${['admin','secretary','supervisor'].map(r=>`<div class="row"><span>${ROLES[r]}</span><span><input style="width:90px;margin:0" data-pin="${r}" value="${esc(S.pins[r])}"></span></div>`).join('')}<button class="btn sm" data-act="savePins">حفظ الرموز</button></div>
 ${logCard(40)}
 <div class="card"><h2>بيانات</h2><button class="btn alt sm" data-act="export">تصدير نسخة احتياطية</button> <button class="btn bad sm" data-act="reset">مسح كل البيانات</button></div>`}

function vSecretary(){
 return `<div class="card"><h2>تسجيل طالبة جديدة</h2><input id="sn" placeholder="اسم الطالبة"><input id="sp" placeholder="رمز دخول الطالبة">
 <select id="st">${S.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><input id="sph" placeholder="هاتف ولي الأمر (اختياري)">
 <button class="btn" data-act="addS">تسجيل</button></div>
 <div class="card"><h2>الطالبات (${S.students.length})</h2>${S.students.map(s=>`<div class="row"><span>${esc(s.name)}<br><span class="muted">${esc(tName(s.teacher))} ${s.phone?'· '+esc(s.phone):''}</span></span><button class="btn bad sm" data-act="delS" data-id="${s.id}">حذف</button></div>`).join('')||'<span class="muted">لا طالبات</span>'}</div>${logCard(8)}`}

function vSupervisor(){
 return `<div class="card"><h2>متابعة المعلمات</h2>${S.teachers.map(t=>{const st=S.students.filter(s=>s.teacher==t.id),p=st.filter(s=>attToday(s)?.st==='حاضرة').length;
  return `<div class="row"><span>${esc(t.name)}<br><span class="muted">${st.length} طالبة · حاضرات اليوم ${p}</span></span></div>`}).join('')}</div>
 <div class="card"><h2>ملاحظة توجيهية</h2><select id="nt"><option value="">— على الطالبة —</option>${S.students.map(s=>`<option value="s${s.id}">${esc(s.name)}</option>`).join('')}${S.teachers.map(t=>`<option value="t${t.id}">معلمة: ${esc(t.name)}</option>`).join('')}</select>
 <textarea id="nx" rows="2" placeholder="الملاحظة"></textarea><button class="btn" data-act="addN">حفظ</button></div>
 <div class="card"><h2>الملاحظات</h2>${S.notes.slice(0,20).map(n=>`<div class="row"><span>${esc(n.text)}<br><span class="muted">${esc(n.to)} · ${n.t}</span></span></div>`).join('')||'<span class="muted">لا ملاحظات</span>'}</div>${logCard(10)}`}

function vTeacher(){
 const mine=scope();const tid=sess.role==='teacher'?sess.id:null;
 return `<div class="card"><h2>حضور اليوم — ${today()}</h2>${mine.map(s=>{const a=attToday(s);return `<div class="row"><span>${esc(s.name)} ${a?`<span class="tag ${a.st==='حاضرة'?'ok':'bad'}">${a.st}</span>`:''}</span><span><button class="btn ok sm" data-act="att" data-id="${s.id}" data-v="حاضرة">حاضرة</button> <button class="btn bad sm" data-act="att" data-id="${s.id}" data-v="غائبة">غائبة</button></span></div>`}).join('')||'<span class="muted">لا طالبات مسجلات لديك</span>'}</div>
 <div class="card"><h2>تسجيل حفظ / تقييم</h2><select id="rs">${mine.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
 <select id="rt"><option>حفظ جديد</option><option>مراجعة</option><option>تلاوة</option><option>سلوك</option></select>
 <input id="rv" placeholder="التفصيل (مثال: سورة النبأ ١-٢٠) أو الدرجة"><button class="btn" data-act="addR">حفظ التسجيل</button></div>
 <div class="card"><h2>آخر التسجيلات</h2>${S.records.filter(r=>mine.some(s=>s.id==r.sid)).slice(0,15).map(r=>`<div class="row"><span>${esc(sName(r.sid))}: ${esc(r.type)} — ${esc(r.v)}<br><span class="muted">${r.t}</span></span></div>`).join('')||'<span class="muted">لا تسجيلات</span>'}</div>`}

function vStudent(){
 const s=scope()[0]||S.students.find(x=>x.id==sess.id);if(!s)return '<div class="card">لا بيانات</div>';
 const att=S.attendance.filter(a=>a.sid==s.id);
 return `<div class="card"><h2>${esc(s.name)}</h2><span class="muted">المعلمة: ${esc(tName(s.teacher))}</span><br>
 <span class="tag ok">حضور ${att.filter(a=>a.st==='حاضرة').length}</span> <span class="tag bad">غياب ${att.filter(a=>a.st==='غائبة').length}</span></div>
 <div class="card"><h2>سجلي</h2>${S.records.filter(r=>r.sid==s.id).map(r=>`<div class="row"><span>${esc(r.type)} — ${esc(r.v)}<br><span class="muted">${r.t}</span></span></div>`).join('')||'<span class="muted">لا تسجيلات بعد</span>'}</div>
 <div class="card"><h2>ملاحظات</h2>${S.notes.filter(n=>n.sid==s.id).map(n=>`<div class="row">${esc(n.text)}</div>`).join('')||'<span class="muted">لا ملاحظات</span>'}</div>`}

function bind(){
 $('#app').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=+b.dataset.id,v=x=>$(x)?.value.trim();
  if(a==='addT'){if(!v('#tn')||!v('#tp'))return alert('أكملي الحقول');S.teachers.push({id:++S.seq,name:v('#tn'),pin:v('#tp')});log('أضاف معلمة: '+v('#tn'))}
  if(a==='savePins'){document.querySelectorAll('[data-pin]').forEach(i=>S.pins[i.dataset.pin]=i.value.trim());log('عدّل الرموز السرية')}
  if(a==='addS'){if(!v('#sn')||!v('#sp')||!v('#st'))return alert('أكملي الحقول');S.students.push({id:++S.seq,name:v('#sn'),pin:v('#sp'),teacher:+v('#st'),phone:v('#sph')});log('سجّل طالبة جديدة: '+v('#sn'))}
  if(a==='delS'){if(!confirm('حذف الطالبة؟'))return;log('حذف الطالبة: '+sName(id));S.students=S.students.filter(s=>s.id!==id)}
  if(a==='att'){S.attendance=S.attendance.filter(x=>!(x.sid==id&&x.d===today()));S.attendance.push({sid:id,d:today(),st:b.dataset.v});log(`${b.dataset.v}: ${sName(id)}`)}
  if(a==='addR'){if(!v('#rs')||!v('#rv'))return alert('أكملي الحقول');S.records.unshift({sid:+v('#rs'),type:v('#rt'),v:v('#rv'),t:now()});log(`سجّل ${v('#rt')} لـ ${sName(+v('#rs'))}: ${v('#rv')}`)}
  if(a==='addN'){if(!v('#nx'))return;const t=v('#nt');const o={text:v('#nx'),t:now(),to:'عام'};
   if(t[0]==='s'){o.sid=+t.slice(1);o.to=sName(o.sid)}if(t[0]==='t')o.to='معلمة: '+tName(+t.slice(1));S.notes.unshift(o);log('ملاحظة توجيهية إلى '+o.to)}
  if(a==='export'){const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));x.download='institute-backup.json';x.click();return}
  if(a==='reset'){if(!confirm('سيُمسح كل شيء!'))return;S=def();sess=null;save();return loginView()}
  save();render()}}

// تحديث لحظي بين الشاشات المفتوحة على نفس الجهاز
addEventListener('storage',e=>{if(e.key===KEY){S=JSON.parse(e.newValue);if(sess)render()}});
loginView();
</script>
</body>
</html>
